<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diario de Estudio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <!-- Cabecera -->
      <header class="text-center mb-5">
        <div class="header-icon"><i class="fas fa-compass"></i></div>
        <h1>Diario de Estudio</h1>
        <p class="header-subtitle">Cada día cuenta. Cada sesión importa.</p>
      </header>

      <!-- Racha -->
      <div class="streak-badge text-center mb-5">
        <div class="streak-circle">
          <span class="streak-number" id="streak">0</span>
          <span class="streak-unit">días</span>
        </div>
        <p class="streak-label mb-0"><i class="fas fa-fire"></i> de racha</p>
        <p class="best-streak mb-0">
          <i class="fas fa-trophy"></i> Mejor racha:
          <span id="best-streak">0</span> días
        </p>
      </div>

      <!-- Totales de tiempo -->
      <div class="time-stats text-center mb-5">
        <span class="stat-item">
          <i class="fas fa-clock"></i>
          <span id="weekly-minutes">0 min</span> esta semana
        </span>
        <span class="stat-separator">·</span>
        <span class="stat-item">
          <i class="fas fa-calendar-check"></i>
          <span id="monthly-days">0 días</span> este mes
        </span>
      </div>

      <!-- Formulario -->
      <form id="session-form" class="mb-5">
        <div class="form-card">
          <h2 class="form-title"><i class="fas fa-pen"></i> Nueva sesión</h2>
          <div class="mb-3">
            <label for="date" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="date" required />
          </div>
          <div class="mb-3">
            <label for="topic" class="form-label">Tema</label>
            <input
              type="text"
              class="form-control"
              id="topic"
              placeholder="¿Qué estudiaste?"
              required
            />
          </div>
          <div class="mb-3">
            <label for="minutes" class="form-label">Minutos</label>
            <input
              type="number"
              class="form-control"
              id="minutes"
              min="1"
              placeholder="Minutos estudiados"
              required
            />
          </div>
          <button type="submit" class="btn-submit w-100">
            <i class="fas fa-plus"></i> Registrar sesión
          </button>
        </div>
      </form>

      <!-- Lista de sesiones -->
      <h2 class="section-title"><i class="fas fa-book-open"></i> Sesiones</h2>
      <div id="sessions-list" class="sessions-list"></div>
    </div>

    <!-- Modal de edición -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar sesión</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="edit-date" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="edit-date" required />
            </div>
            <div class="mb-3">
              <label for="edit-topic" class="form-label">Tema</label>
              <input
                type="text"
                class="form-control"
                id="edit-topic"
                placeholder="¿Qué estudiaste?"
                required
              />
            </div>
            <div class="mb-3">
              <label for="edit-minutes" class="form-label">Minutos</label>
              <input
                type="number"
                class="form-control"
                id="edit-minutes"
                min="1"
                placeholder="Minutos estudiados"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-cancel" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button type="button" class="btn-save" id="save-edit">
              Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
  </body>
</html>
