<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diario de Estudio</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="text-center mb-4">
        <i class="fas fa-book-open"></i> Diario de Estudio
      </h1>

      <!-- Racha -->
      <div class="streak-card text-center mb-4">
        <div class="streak-number" id="streak">0</div>
        <div class="streak-fire"><i class="fas fa-fire"></i></div>
        <p class="streak-label mb-0">días de racha</p>
      </div>

      <!-- Formulario -->
      <form id="session-form" class="mb-4">
        <div class="mb-3">
          <label for="date" class="form-label">Fecha</label>
          <input type="date" class="form-control" id="date" required />
        </div>
        <div class="mb-3">
          <label for="topic" class="form-label">Tema</label>
          <input
            type="text"
            class="form-control"
            id="topic"
            placeholder="¿Qué estudiaste?"
            required
          />
        </div>
        <div class="mb-3">
          <label for="minutes" class="form-label">Minutos</label>
          <input
            type="number"
            class="form-control"
            id="minutes"
            min="1"
            placeholder="Minutos estudiados"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-plus"></i> Registrar sesión
        </button>
      </form>

      <!-- Lista de sesiones -->
      <h2><i class="fas fa-list"></i> Sesiones</h2>
      <ul id="sessions-list" class="list-group"></ul>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
  </body>
</html>
